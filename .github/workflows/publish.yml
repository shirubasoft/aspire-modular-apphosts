name: Publish NuGet package

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore
        run: dotnet restore Aspire.ModularAppHosts.slnx

      - name: Build
        run: dotnet build Aspire.ModularAppHosts.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Aspire.ModularAppHosts.slnx --configuration Release --no-build --no-restore

      - name: Version and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          npx --yes \
            --package=semantic-release@25.0.8 \
            --package=@semantic-release/exec@7.1.0 \
            --package=conventional-changelog-conventionalcommits@10.2.1 \
            semantic-release
