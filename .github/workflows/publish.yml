name: Publish NuGet package

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: >-
      vars.NUGET_PUBLISH_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download packages from CI
        uses: actions/download-artifact@v7
        with:
          name: nuget-packages
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install locked release tooling
        run: npm ci --prefix .github/release

      - name: Bootstrap pre-1.0 version baseline
        shell: bash
        run: |
          set -euo pipefail
          if ! git describe --tags --abbrev=0 --match 'v[0-9]*' >/dev/null 2>&1; then
            git tag v0.0.0 "$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

      - name: Version and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          .github/release/node_modules/.bin/semantic-release
