name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate workflows with actionlint 1.7.12
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: >-
            -color
            .github/workflows/ci.yml
            .github/workflows/publish.yml
            docs/workflows/repo-a-e2e.yml
            docs/workflows/repo-b-dispatch.yml
            docs/workflows/repo-b-workflow-call.yml

  release-version:
    if: >-
      vars.NUGET_PUBLISH_ENABLED == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release-version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install locked release tooling
        run: npm ci --prefix .github/release

      - name: Bootstrap pre-1.0 version baseline
        shell: bash
        run: |
          set -euo pipefail
          if ! git describe --tags --abbrev=0 --match 'v[0-9]*' >/dev/null 2>&1; then
            git tag v0.0.0 "$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

      - name: Calculate release version
        id: release-version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_RELEASE_VERSION_FILE: ${{ runner.temp }}/next-release-version
        run: |
          set -euo pipefail
          .github/release/node_modules/.bin/semantic-release --dry-run
          if [[ -f "$NEXT_RELEASE_VERSION_FILE" ]]; then
            echo "version=$(<"$NEXT_RELEASE_VERSION_FILE")" >> "$GITHUB_OUTPUT"
          fi

  build-test-pack:
    needs: release-version
    if: >-
      always() &&
      (needs.release-version.result == 'success' || needs.release-version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up minimum supported .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.102

      - name: Validate, test, and pack on Linux
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_VERSION" ]]; then
            ./build.sh --package-version "$RELEASE_VERSION"
            printf '%s\n' "$RELEASE_VERSION" > artifacts/release-version.txt
          else
            ./build.sh
          fi

      - name: Enforce core library line coverage
        if: runner.os != 'Windows'
        run: >-
          dotnet test tests/Aspire.Hosting.ModularAppHosts.Tests/Aspire.Hosting.ModularAppHosts.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CollectCoverage=true
          -p:CoverletOutput=../../artifacts/coverage/core.cobertura.xml
          -p:CoverletOutputFormat=cobertura
          '-p:Include=[Shirubasoft.Aspire.ModularAppHosts*]*'
          -p:Threshold=90
          -p:ThresholdType=line
          -p:ThresholdStat=total

      - name: Enforce testing library line coverage
        if: runner.os != 'Windows'
        run: >-
          dotnet test tests/Aspire.Hosting.ModularAppHosts.Testing.Tests/Aspire.Hosting.ModularAppHosts.Testing.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CollectCoverage=true
          -p:CoverletOutput=../../artifacts/coverage/testing.cobertura.xml
          -p:CoverletOutputFormat=cobertura
          '-p:Include=[Shirubasoft.Aspire.ModularAppHosts.Testing]*'
          -p:Threshold=70
          -p:ThresholdType=line
          -p:ThresholdStat=total

      - name: Upload coverage reports
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: artifacts/coverage/*.cobertura.xml
          if-no-files-found: error

      - name: Validate, test, and pack on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1

      - name: Upload packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/release-version.txt
          if-no-files-found: error

  e2e-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASPIRE_TEST_DEPLOYMENT_ENVIRONMENT: CI
      ASPIRE_TEST_DEPLOYMENT_OUTPUT_PATH: ${{ github.workspace }}/samples/E2ETesting/EShop.E2E.AppHost/aspire-output
      Parameters__orders_api_key: e2e-orders-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore the pinned Aspire CLI
        id: restore-aspire
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore samples/E2ETesting/EShop.E2E.Tests/EShop.E2E.Tests.csproj

      - name: Build E2E sample
        run: dotnet build samples/E2ETesting/EShop.E2E.Tests/EShop.E2E.Tests.csproj --configuration Release --no-restore

      - name: Test E2E through builder-owned Docker Compose
        id: compose-tests
        env:
          ESHOP_E2E_MODE: compose
        run: dotnet test samples/E2ETesting/EShop.E2E.Tests/EShop.E2E.Tests.csproj --configuration Release --no-build --no-restore

      - name: Emergency Docker Compose teardown
        if: ${{ always() && steps.restore-aspire.outcome == 'success' && (steps.compose-tests.outcome == 'failure' || steps.compose-tests.outcome == 'cancelled') }}
        run: >-
          dotnet tool run aspire -- destroy
          --apphost samples/E2ETesting/EShop.E2E.AppHost/EShop.E2E.AppHost.csproj
          --output-path samples/E2ETesting/EShop.E2E.AppHost/aspire-output
          --environment CI
          --yes
          --non-interactive

  e2e-modular-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASPIRE_CONTAINER_RUNTIME: docker
      MODULAR_SAMPLES_E2E: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore the modular sample graph
        run: dotnet restore samples/ModularSamples.Tests/ModularSamples.Tests.csproj

      - name: Start and validate both modular AppHosts
        run: >-
          dotnet test samples/ModularSamples.Tests/ModularSamples.Tests.csproj
          --configuration Release --no-restore

  e2e-image-registry-pipelines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASPIRE_CONTAINER_RUNTIME: docker

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore the pinned Aspire CLI and image-push AppHost
        run: |
          dotnet tool restore
          dotnet restore samples/ImagePushE2E/ImagePush.E2E.AppHost/ImagePush.E2E.AppHost.csproj

      - name: Describe effective module image identities
        run: bash samples/ImagePushE2E/test-image-describe.sh

      - name: Push scoped and complete image sets to a local registry
        run: bash samples/ImagePushE2E/test-image-push.sh

      - name: Pull scoped and complete image sets from a local registry
        run: bash samples/ImagePushE2E/test-image-pull.sh

  e2e-workflow-image-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASPIRE_CONTAINER_RUNTIME: docker
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore the pinned Aspire CLI
        run: dotnet tool restore

      - name: Restore the producer and consumer sample
        run: dotnet restore samples/MultiRepoE2E/Spire.Consumer.Tests/Spire.Consumer.Tests.csproj

      - name: Pack the workflow tool
        run: >-
          dotnet pack src/Aspire.Hosting.ModularAppHosts.Tool/Aspire.Hosting.ModularAppHosts.Tool.csproj
          --configuration Release
          --output artifacts/workflow-tool-package
          -p:PackageVersion=0.0.0-workflow-e2e

      - name: Install the packed workflow tool
        run: >-
          dotnet tool install
          --tool-path artifacts/workflow-tool
          --add-source artifacts/workflow-tool-package
          --version 0.0.0-workflow-e2e
          Shirubasoft.Aspire.ModularAppHosts.Tool

      - name: Publish Repo B images and emit the manifest
        id: publish-images
        run: >-
          artifacts/workflow-tool/modular-apphosts manifest publish
          --apphost samples/MultiRepoE2E/Spire.Producer.AppHost
          --selector multi-repo-resource-build/multi-repo-api
          --tag workflow-e2e
          --output artifacts/workflow-image-manifest.json

      - name: Run Repo A E2E tests against the overridden image
        run: >-
          artifacts/workflow-tool/modular-apphosts manifest apply
          --file artifacts/workflow-image-manifest.json
          --
          dotnet test samples/MultiRepoE2E/Spire.Consumer.Tests/Spire.Consumer.Tests.csproj
          --configuration Release

  e2e-multi-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore the pinned Aspire CLI
        run: dotnet tool restore

      - name: Validate initialization and runtime repository policies
        run: >-
          dotnet run
          --project samples/MultiRepoE2E/Spire.MultiRepo.E2E.Driver/Spire.MultiRepo.E2E.Driver.csproj
          --configuration Release
          --
          --repository-root "${{ github.workspace }}"
          --container-runtime docker
