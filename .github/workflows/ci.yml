name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Aspire.ModularAppHosts.slnx

      - name: Verify formatting
        run: dotnet format Aspire.ModularAppHosts.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Aspire.ModularAppHosts.slnx --configuration Release --no-restore

      - name: Test core library
        run: dotnet test tests/Aspire.Hosting.ModularAppHosts.Tests/Aspire.Hosting.ModularAppHosts.Tests.csproj --configuration Release --no-build --no-restore

      - name: Test testing package
        run: dotnet test tests/Aspire.Hosting.ModularAppHosts.Testing.Tests/Aspire.Hosting.ModularAppHosts.Testing.Tests.csproj --configuration Release --no-build --no-restore

      - name: Test E2E through the AppHost
        env:
          ESHOP_E2E_MODE: apphost
        run: dotnet test samples/E2ETesting/EShop.E2E.Tests/EShop.E2E.Tests.csproj --configuration Release --no-build --no-restore

      - name: Pack
        run: |
          dotnet pack src/Aspire.Hosting.ModularAppHosts/Aspire.Hosting.ModularAppHosts.csproj --configuration Release --no-build --no-restore --output artifacts
          dotnet pack src/Aspire.Hosting.ModularAppHosts.Testing/Aspire.Hosting.ModularAppHosts.Testing.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  e2e-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASPIRE_TEST_DEPLOYMENT_ENVIRONMENT: CI
      ASPIRE_TEST_DEPLOYMENT_OUTPUT_PATH: ${{ github.workspace }}/samples/E2ETesting/EShop.E2E.AppHost/aspire-output
      Parameters__orders_api_key: e2e-orders-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Aspire CLI
        id: install-aspire
        run: dotnet tool install --global Aspire.Cli --version 13.4.6

      - name: Restore
        run: dotnet restore samples/E2ETesting/EShop.E2E.Tests/EShop.E2E.Tests.csproj

      - name: Build E2E sample
        run: dotnet build samples/E2ETesting/EShop.E2E.Tests/EShop.E2E.Tests.csproj --configuration Release --no-restore

      - name: Test E2E through builder-owned Docker Compose
        id: compose-tests
        env:
          ESHOP_E2E_MODE: compose
        run: dotnet test samples/E2ETesting/EShop.E2E.Tests/EShop.E2E.Tests.csproj --configuration Release --no-build --no-restore

      - name: Emergency Docker Compose teardown
        if: ${{ always() && steps.install-aspire.outcome == 'success' && (steps.compose-tests.outcome == 'failure' || steps.compose-tests.outcome == 'cancelled') }}
        run: >-
          aspire destroy
          --apphost samples/E2ETesting/EShop.E2E.AppHost/EShop.E2E.AppHost.csproj
          --output-path samples/E2ETesting/EShop.E2E.AppHost/aspire-output
          --environment CI
          --yes
          --non-interactive
