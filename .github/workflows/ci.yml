name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-version:
    if: >-
      vars.NUGET_PUBLISH_ENABLED == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release-version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install locked release tooling
        run: npm ci --prefix .github/release

      - name: Bootstrap pre-1.0 version baseline
        shell: bash
        run: |
          set -euo pipefail
          if ! git describe --tags --abbrev=0 --match 'v[0-9]*' >/dev/null 2>&1; then
            git tag v0.0.0 "$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

      - name: Calculate release version
        id: release-version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_RELEASE_VERSION_FILE: ${{ runner.temp }}/next-release-version
        run: |
          set -euo pipefail
          .github/release/node_modules/.bin/semantic-release --dry-run
          if [[ -f "$NEXT_RELEASE_VERSION_FILE" ]]; then
            echo "version=$(<"$NEXT_RELEASE_VERSION_FILE")" >> "$GITHUB_OUTPUT"
          fi

  build-test-pack:
    needs: release-version
    if: >-
      always() &&
      (needs.release-version.result == 'success' || needs.release-version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up minimum supported .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.102

      - name: Validate, test, and pack on Linux
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_VERSION" ]]; then
            ./build.sh --package-version "$RELEASE_VERSION"
            printf '%s\n' "$RELEASE_VERSION" > artifacts/release-version.txt
          else
            ./build.sh
          fi

      - name: Enforce core library line coverage
        if: runner.os != 'Windows'
        run: >-
          dotnet test tests/Aspire.Hosting.ModularAppHosts.Tests/Aspire.Hosting.ModularAppHosts.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CollectCoverage=true
          -p:CoverletOutput=../../artifacts/coverage/core.cobertura.xml
          -p:CoverletOutputFormat=cobertura
          '-p:Include=[Shirubasoft.Aspire.ModularAppHosts*]*'
          -p:Threshold=90
          -p:ThresholdType=line
          -p:ThresholdStat=total

      - name: Enforce testing library line coverage
        if: runner.os != 'Windows'
        run: >-
          dotnet test tests/Aspire.Hosting.ModularAppHosts.Testing.Tests/Aspire.Hosting.ModularAppHosts.Testing.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CollectCoverage=true
          -p:CoverletOutput=../../artifacts/coverage/testing.cobertura.xml
          -p:CoverletOutputFormat=cobertura
          '-p:Include=[Shirubasoft.Aspire.ModularAppHosts.Testing]*'
          -p:Threshold=70
          -p:ThresholdType=line
          -p:ThresholdStat=total

      - name: Upload coverage reports
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: artifacts/coverage/*.cobertura.xml
          if-no-files-found: error

      - name: Validate, test, and pack on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1

      - name: Upload packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/release-version.txt
          if-no-files-found: error

  e2e-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASPIRE_TEST_DEPLOYMENT_ENVIRONMENT: CI
      ASPIRE_TEST_DEPLOYMENT_OUTPUT_PATH: ${{ github.workspace }}/samples/E2ETesting/EShop.E2E.AppHost/aspire-output
      Parameters__orders_api_key: e2e-orders-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install the pinned Aspire CLI
        id: install-aspire
        run: |
          aspire_version="$(jq --raw-output '.tools["aspire.cli"].version' .config/dotnet-tools.json)"
          dotnet tool install --global Aspire.Cli --version "$aspire_version"

      - name: Restore
        run: dotnet restore samples/E2ETesting/EShop.E2E.Tests/EShop.E2E.Tests.csproj

      - name: Build E2E sample
        run: dotnet build samples/E2ETesting/EShop.E2E.Tests/EShop.E2E.Tests.csproj --configuration Release --no-restore

      - name: Test E2E through builder-owned Docker Compose
        id: compose-tests
        env:
          ESHOP_E2E_MODE: compose
        run: dotnet test samples/E2ETesting/EShop.E2E.Tests/EShop.E2E.Tests.csproj --configuration Release --no-build --no-restore

      - name: Emergency Docker Compose teardown
        if: ${{ always() && steps.install-aspire.outcome == 'success' && (steps.compose-tests.outcome == 'failure' || steps.compose-tests.outcome == 'cancelled') }}
        run: >-
          aspire destroy
          --apphost samples/E2ETesting/EShop.E2E.AppHost/EShop.E2E.AppHost.csproj
          --output-path samples/E2ETesting/EShop.E2E.AppHost/aspire-output
          --environment CI
          --yes
          --non-interactive

  e2e-modular-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASPIRE_CONTAINER_RUNTIME: docker

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore the pinned Aspire CLI and sample graph
        run: |
          dotnet tool restore
          dotnet restore Aspire.ModularAppHosts.slnx

      - name: Start and validate both modular AppHosts
        shell: bash
        run: bash samples/test-modular-apphosts.sh

  e2e-image-registry-pipelines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASPIRE_CONTAINER_RUNTIME: docker

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore the pinned Aspire CLI and image-push AppHost
        run: |
          dotnet tool restore
          dotnet restore samples/ImagePushE2E/ImagePush.E2E.AppHost/ImagePush.E2E.AppHost.csproj

      - name: Describe effective module image identities
        run: bash samples/ImagePushE2E/test-image-describe.sh

      - name: Push scoped and complete image sets to a local registry
        run: bash samples/ImagePushE2E/test-image-push.sh

      - name: Pull scoped and complete image sets from a local registry
        run: bash samples/ImagePushE2E/test-image-pull.sh

  e2e-preview-workflow-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASPIRE_CONTAINER_RUNTIME: docker

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore the preview sample toolchain
        run: |
          dotnet tool restore
          dotnet restore src/Aspire.Hosting.ModularAppHosts.Tool/Aspire.Hosting.ModularAppHosts.Tool.csproj
          dotnet restore samples/ImagePushE2E/ImagePush.E2E.AppHost/ImagePush.E2E.AppHost.csproj
          dotnet restore samples/ContractDependencyPreview/ContractDependencyPreview.AppHost/ContractDependencyPreview.AppHost.csproj

      - name: Validate preview policy and producer workflow generation
        run: bash samples/PreviewWorkflow/validate.sh

      - name: Validate exact preview contract dependency locks
        run: bash samples/ContractDependencyPreview/validate.sh

  e2e-multi-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASPIRE_CONTAINER_RUNTIME: docker

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore the pinned Aspire CLI
        run: dotnet tool restore

      - name: Create isolated consumer and resource repositories
        shell: bash
        run: |
          set -euo pipefail
          multi_repo_root="$(mktemp -d "$RUNNER_TEMP/multi-repo-e2e.XXXXXX")"
          package_version="0.0.0-multi-repo-e2e"
          package_feed="$multi_repo_root/packages"
          consumer_repository="$multi_repo_root/consumer"
          resource_repository="$multi_repo_root/resource-build-source"
          mkdir -p "$package_feed"

          dotnet pack src/Aspire.Hosting.ModularAppHosts/Aspire.Hosting.ModularAppHosts.csproj \
            --configuration Release --output "$package_feed" -p:PackageVersion="$package_version"
          dotnet pack samples/MultiRepoE2E/Spire.ModuleContract/Spire.ModuleContract.csproj \
            --configuration Release --output "$package_feed" -p:PackageVersion="$package_version"

          git clone --no-local "$GITHUB_WORKSPACE" "$consumer_repository"
          mv "$consumer_repository/samples/MultiRepoE2E/Spire.ModuleContract" \
            "$multi_repo_root/producer-contract-source"
          mv "$consumer_repository/samples/MultiRepoE2E/ResourceBuildRepository" \
            "$resource_repository"
          test ! -e "$consumer_repository/samples/MultiRepoE2E/Spire.ModuleContract"
          test ! -e "$consumer_repository/samples/MultiRepoE2E/ResourceBuildRepository"

          git -C "$resource_repository" init --initial-branch main
          git -C "$resource_repository" config user.name "MultiRepo E2E"
          git -C "$resource_repository" config user.email "multi-repo@example.invalid"
          git -C "$resource_repository" add .
          git -C "$resource_repository" commit -m "Add pinned resource build"
          resource_revision="$(git -C "$resource_repository" rev-parse HEAD)"

          printf '%s\n' 'multi-repo-resource-unpinned-latest' \
            > "$resource_repository/marker.txt"
          git -C "$resource_repository" add marker.txt
          git -C "$resource_repository" commit -m "Change marker after pinned revision"
          resource_latest_revision="$(git -C "$resource_repository" rev-parse HEAD)"
          test "$resource_revision" != "$resource_latest_revision"

          echo "MULTI_REPO_ROOT=$multi_repo_root" >> "$GITHUB_ENV"
          echo "MULTI_REPO_APPHOST=$consumer_repository/samples/MultiRepoE2E/Spire.Consumer.AppHost" >> "$GITHUB_ENV"
          echo "MULTI_REPO_RESOURCE_BUILD_REPOSITORY=$resource_repository" >> "$GITHUB_ENV"
          echo "MULTI_REPO_RESOURCE_BUILD_REVISION=$resource_revision" >> "$GITHUB_ENV"
          echo "MULTI_REPO_RESOURCE_LATEST_REVISION=$resource_latest_revision" >> "$GITHUB_ENV"
          echo "Aspire__ModularAppHosts__Modules__multi-repo-resource-build__BuildRepository=$resource_repository" >> "$GITHUB_ENV"
          echo "Aspire__ModularAppHosts__Modules__multi-repo-resource-build__BuildRepositoryRevision=$resource_revision" >> "$GITHUB_ENV"
          echo "SpireContractPackageVersion=$package_version" >> "$GITHUB_ENV"
          echo "RestoreAdditionalProjectSources=$package_feed" >> "$GITHUB_ENV"

      - name: Restore the isolated package consumer
        run: dotnet restore "$MULTI_REPO_APPHOST"

      - name: Validate a real multi-repository AppHost
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool run aspire -- start --apphost "$MULTI_REPO_APPHOST" --format Json --non-interactive
          trap 'dotnet tool run aspire -- stop --apphost "$MULTI_REPO_APPHOST" --non-interactive' EXIT

          dotnet tool run aspire -- wait multi-repo-api \
            --apphost "$MULTI_REPO_APPHOST" \
            --timeout 180 \
            --non-interactive

          mapfile -t managed_git_directories < <(
            find "$MULTI_REPO_APPHOST/.aspire/module-repositories" \
              -type d \
              -name .git \
              -print
          )
          if (( ${#managed_git_directories[@]} != 1 )); then
            echo "Expected exactly one managed build repository checkout." >&2
            exit 1
          fi
          build_checkout="${managed_git_directories[0]%/.git}"
          actual_revision="$(git -C "$build_checkout" rev-parse HEAD)"
          test "$actual_revision" = "$MULTI_REPO_RESOURCE_BUILD_REVISION"
          test "$(git -C "$MULTI_REPO_RESOURCE_BUILD_REPOSITORY" rev-parse HEAD)" = \
            "$MULTI_REPO_RESOURCE_LATEST_REVISION"
          test -z "$(git -C "$build_checkout" branch --show-current)"

          origin="$(git -C "$build_checkout" remote get-url origin)"
          test "$(realpath "$origin")" = "$(realpath "$MULTI_REPO_RESOURCE_BUILD_REPOSITORY")"
          test -n "$(docker image ls \
            --filter 'reference=multi-repo-e2e-resource:*' \
            --format '{{.Repository}}:{{.Tag}}')"

          resource_url="$(
            dotnet tool run aspire -- describe multi-repo-api \
              --apphost "$MULTI_REPO_APPHOST" \
              --format Json \
              --non-interactive |
              jq --raw-output '[.resources[].urls[] | select(.name == "http") | .url][0] // empty'
          )"
          test -n "$resource_url"
          test "$(curl --fail --show-error --silent "${resource_url%/}/health.txt")" = \
            "healthy-from-separate-build-repository"
          test "$(curl --fail --show-error --silent "${resource_url%/}/marker.txt")" = \
            "multi-repo-resource-pinned-revision"
