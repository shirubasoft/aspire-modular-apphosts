# Generated by: dotnet modular-apphosts preview workflow generate producer
# Authentication remains producer-owned; regenerate after changing generator options.
name: Module preview

permissions:
  actions: write
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      source-ref:
        description: Pushed producer branch to check out
        required: false
        type: string
        default: ''
      contract-version:
        description: Exact contract package version published for this preview
        required: true
        type: string
    secrets:
      CONTAINER_REGISTRY_TOKEN:
        required: true
      PACKAGE_FEED_TOKEN:
        required: true
      PREVIEW_GITHUB_TOKEN:
        required: true
    outputs:
      workflow-run-id:
        description: Consumer workflow run ID
        value: ${{ jobs.preview.outputs.workflow-run-id }}
      workflow-run-url:
        description: Consumer workflow run URL
        value: ${{ jobs.preview.outputs.workflow-run-url }}
  workflow_dispatch:
    inputs:
      source-ref:
        description: Pushed producer branch to check out
        required: false
        type: string
        default: ''
      contract-version:
        description: Exact contract package version published for this preview
        required: true
        type: string

run-name: Module preview · ${{ inputs.source-ref || github.head_ref || github.ref_name }}

jobs:
  preview:
    runs-on: ubuntu-latest
    outputs:
      workflow-run-id: ${{ steps.trigger.outputs.workflow_run_id }}
      workflow-run-url: ${{ steps.trigger.outputs.workflow_run_url }}
    env:
      APPHOST: 'src/Sample.AppHost/Sample.AppHost.csproj'
      PRODUCER_DESCRIPTOR: 'module-preview.producer.json'
      ASPIRE_VERSION: '13.4.6'
      MODULAR_APPHOSTS_VERSION: '4.4.0'
      PREVIEW_ARTIFACTS_DIR: ${{ runner.temp }}/module-preview
      ASPIRE_TOOL_DIR: ${{ runner.temp }}/tools/aspire
      MODULAR_APPHOSTS_TOOL_DIR: ${{ runner.temp }}/tools/modular-apphosts
      TOOLS_NUGET_CONFIG: ${{ runner.temp }}/modular-apphosts-tools.nuget.config
      NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
      Aspire__ModularAppHosts__PublishImages: 'true'
      GH_TOKEN: ${{ secrets.PREVIEW_GITHUB_TOKEN }}
      CONTRACT_VERSION: ${{ inputs.contract-version }}
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_FEED_TOKEN }}
      REGISTRY_TOKEN: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}
    steps:
      - name: Check out the pushed producer branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Verify attached pushed branch
        shell: bash
        run: |
          set -euo pipefail
          branch=$(git symbolic-ref --quiet --short HEAD) || {
            echo 'The producer checkout must be attached to a branch.' >&2
            exit 1
          }
          commit=$(git rev-parse HEAD)
          remote_commit=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
          if [[ -z "$remote_commit" || "$remote_commit" != "$commit" ]]; then
            echo "HEAD must be the pushed tip of origin branch '$branch'." >&2
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: 'global.json'

      - name: Install isolated workflow tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PREVIEW_ARTIFACTS_DIR" "$ASPIRE_TOOL_DIR" "$MODULAR_APPHOSTS_TOOL_DIR"
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<configuration>' \
            '  <packageSources>' \
            '    <clear />' \
            '    <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />' \
            '  </packageSources>' \
            '</configuration>' > "$TOOLS_NUGET_CONFIG"
          dotnet tool install aspire.cli \
            --tool-path "$ASPIRE_TOOL_DIR" \
            --version "$ASPIRE_VERSION" \
            --configfile "$TOOLS_NUGET_CONFIG"
          dotnet tool install Shirubasoft.Aspire.ModularAppHosts.Tool \
            --tool-path "$MODULAR_APPHOSTS_TOOL_DIR" \
            --version "$MODULAR_APPHOSTS_VERSION" \
            --configfile "$TOOLS_NUGET_CONFIG"

      - name: Authenticate package feed
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/package-login.sh"

      - name: Publish exact module contract
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/publish-contract.sh" "$CONTRACT_VERSION"

      - name: Authenticate image registries
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/registry-login.sh"

      - name: Describe module images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PREVIEW_ARTIFACTS_DIR/images"
          "$ASPIRE_TOOL_DIR/aspire" do describe-images \
            --apphost "$GITHUB_WORKSPACE/$APPHOST" \
            --output-path "$PREVIEW_ARTIFACTS_DIR/images" \
            --non-interactive

      - name: Build and push declared images
        shell: bash
        run: |
          set -euo pipefail
          image_description="$PREVIEW_ARTIFACTS_DIR/images/module-images.json"
          missing=$(jq -r --slurpfile descriptor "$GITHUB_WORKSPACE/$PRODUCER_DESCRIPTOR" '
            . as $description
            | $descriptor[0].images[].resource as $resource
            | select([
                $description.images[]
                | select(.module == $descriptor[0].module
                    and .resource == $resource
                    and .build != null
                    and .pushReference != null)
              ] | length != 1)
            | $resource
          ' "$image_description")
          if [[ -n "$missing" ]]; then
            echo 'Every descriptor image must have exactly one build publisher and push target.' >&2
            printf 'Missing or ambiguous resources:\n%s\n' "$missing" >&2
            exit 1
          fi
          mapfile -t resources < <(
            jq -r --slurpfile descriptor "$GITHUB_WORKSPACE/$PRODUCER_DESCRIPTOR" '
              .images[]
              | select(.module == $descriptor[0].module)
              | select(.resource as $resource
                  | ($descriptor[0].images | map(.resource) | index($resource)))
              | select(.build != null and .pushReference != null)
              | .effectiveResource
            ' "$image_description" | sort -u
          )
          if (( ${#resources[@]} > 0 )); then
            mkdir -p "$PREVIEW_ARTIFACTS_DIR/push"
            "$ASPIRE_TOOL_DIR/aspire" do push \
              --apphost "$GITHUB_WORKSPACE/$APPHOST" \
              --output-path "$PREVIEW_ARTIFACTS_DIR/push" \
              --non-interactive \
              "${resources[@]}"
          fi

      - name: Produce immutable preview request
        shell: bash
        run: |
          set -euo pipefail
          image_description="$PREVIEW_ARTIFACTS_DIR/images/module-images.json"
          image_args=()
          while IFS=$'\t' read -r resource push_reference; do
            if [[ "$push_reference" == *@* ]]; then
              pushed_repository=${push_reference%@*}
            elif [[ "${push_reference##*/}" == *:* ]]; then
              pushed_repository=${push_reference%:*}
            else
              echo "Image '$resource' has an untagged push reference: $push_reference" >&2
              exit 1
            fi
            manifest=$(docker buildx imagetools inspect \
              "$push_reference" --format '{{json .Manifest}}')
            digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$manifest")
            image_args+=(--image "$resource=$pushed_repository@$digest")
          done < <(
            jq -r --slurpfile descriptor "$GITHUB_WORKSPACE/$PRODUCER_DESCRIPTOR" '
              .images[]
              | select(.module == $descriptor[0].module)
              | select(.resource as $resource
                  | ($descriptor[0].images | map(.resource) | index($resource)))
              | select(.build != null and .pushReference != null)
              | [
                  .resource,
                  .pushReference
                ]
              | @tsv
            ' "$image_description"
          )
          produce_args=(
            preview produce
            --descriptor "$GITHUB_WORKSPACE/$PRODUCER_DESCRIPTOR"
            --output "$PREVIEW_ARTIFACTS_DIR/module-preview.json"
            --working-directory "$GITHUB_WORKSPACE"
            --contract-version "$CONTRACT_VERSION"
          )
          "$MODULAR_APPHOSTS_TOOL_DIR/dotnet-modular-apphosts" \
            "${produce_args[@]}" "${image_args[@]}"

      - name: Trigger and wait for consumer E2E
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          "$MODULAR_APPHOSTS_TOOL_DIR/dotnet-modular-apphosts" preview trigger \
            --manifest "$PREVIEW_ARTIFACTS_DIR/module-preview.json" \
            --repo 'example/consumer-tests' \
            --workflow 'e2e.yml' \
            --ref 'main' \
            --wait \
            --github-output "$GITHUB_OUTPUT"

      - name: Link consumer run
        if: always() && steps.trigger.outputs.workflow_run_url != ''
        shell: bash
        run: |
          echo '### Consumer E2E' >> "$GITHUB_STEP_SUMMARY"
          echo '[Open workflow run](${{ steps.trigger.outputs.workflow_run_url }})' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-preview
          path: ${{ env.PREVIEW_ARTIFACTS_DIR }}
          if-no-files-found: warn
