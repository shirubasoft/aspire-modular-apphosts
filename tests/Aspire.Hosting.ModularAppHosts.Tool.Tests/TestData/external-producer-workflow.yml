# Generated by: dotnet modular-apphosts preview workflow generate producer
# Authentication remains producer-owned; regenerate after changing generator options.
name: Module preview

permissions:
  actions: write
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      source-ref:
        description: Pushed producer branch to check out
        required: false
        type: string
        default: ''
    secrets:
      PREVIEW_GITHUB_TOKEN:
        required: true
    outputs:
      workflow-run-id:
        description: Consumer workflow run ID
        value: ${{ jobs.preview.outputs.workflow-run-id }}
      workflow-run-url:
        description: Consumer workflow run URL
        value: ${{ jobs.preview.outputs.workflow-run-url }}
  workflow_dispatch:
    inputs:
      source-ref:
        description: Pushed producer branch to check out
        required: false
        type: string
        default: ''

run-name: Module preview · ${{ inputs.source-ref || github.head_ref || github.ref_name }}

jobs:
  preview:
    runs-on: ubuntu-latest
    outputs:
      workflow-run-id: ${{ steps.trigger.outputs.workflow_run_id }}
      workflow-run-url: ${{ steps.trigger.outputs.workflow_run_url }}
    env:
      APPHOST: 'src/Consumer.AppHost/Consumer.AppHost.csproj'
      PRODUCER_DESCRIPTOR: 'module-preview.external.producer.json'
      ASPIRE_VERSION: '13.4.6'
      MODULAR_APPHOSTS_VERSION: '5.1.0'
      PREVIEW_ARTIFACTS_DIR: ${{ runner.temp }}/module-preview
      ASPIRE_TOOL_DIR: ${{ runner.temp }}/tools/aspire
      MODULAR_APPHOSTS_TOOL_DIR: ${{ runner.temp }}/tools/modular-apphosts
      TOOLS_NUGET_CONFIG: ${{ runner.temp }}/tools/nuget/nuget.config
      NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
      Aspire__ModularAppHosts__PublishImages: 'true'
      GH_TOKEN: ${{ secrets.PREVIEW_GITHUB_TOKEN }}
      MODULE_NAME: 'external-sample'
      APPHOST_REPOSITORY: 'example/consumer-application'
      APPHOST_REF: 'main'
      APPHOST_CHECKOUT: ${{ runner.temp }}/module-preview-${{ github.run_id }}-${{ github.run_attempt }}/apphost
      Aspire__ModularAppHosts__Modules__external-sample__Containers__external-api__BuildRepository: ${{ github.workspace }}
      Aspire__ModularAppHosts__Modules__external-sample__Projects__external-worker__BuildRepository: ${{ github.workspace }}
    steps:
      - name: Check out the pushed producer branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: 'global.json'

      - name: Install isolated workflow tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PREVIEW_ARTIFACTS_DIR" "$ASPIRE_TOOL_DIR" "$MODULAR_APPHOSTS_TOOL_DIR"
          dotnet new nugetconfig --output "$(dirname "$TOOLS_NUGET_CONFIG")" --force
          dotnet tool install aspire.cli \
            --tool-path "$ASPIRE_TOOL_DIR" \
            --version "$ASPIRE_VERSION" \
            --configfile "$TOOLS_NUGET_CONFIG"
          dotnet tool install Shirubasoft.Aspire.ModularAppHosts.Tool \
            --tool-path "$MODULAR_APPHOSTS_TOOL_DIR" \
            --version "$MODULAR_APPHOSTS_VERSION" \
            --configfile "$TOOLS_NUGET_CONFIG"

      - name: Verify attached pushed branch
        shell: bash
        run: |
          set -euo pipefail
          "$MODULAR_APPHOSTS_TOOL_DIR/dotnet-modular-apphosts" preview export \
            --module 'external-sample' \
            --output "$PREVIEW_ARTIFACTS_DIR/producer.json" \
            --working-directory "$GITHUB_WORKSPACE"
          producer_commit=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          printf '%s=%s\n' 'Aspire__ModularAppHosts__Modules__external-sample__Containers__external-api__BuildRepositoryRevision' "$producer_commit" >> "$GITHUB_ENV"
          printf '%s=%s\n' 'Aspire__ModularAppHosts__Modules__external-sample__Projects__external-worker__BuildRepositoryRevision' "$producer_commit" >> "$GITHUB_ENV"

      - name: Check out trusted AppHost
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e "$APPHOST_CHECKOUT" ]]; then
            echo "External AppHost checkout path already exists: $APPHOST_CHECKOUT" >&2
            exit 1
          fi
          gh repo clone "$APPHOST_REPOSITORY" "$APPHOST_CHECKOUT" -- --no-checkout
          remote_ref="refs/remotes/origin/$APPHOST_REF"
          if [[ "$APPHOST_REF" == refs/heads/* ]]; then
            remote_ref="refs/remotes/origin/${APPHOST_REF#refs/heads/}"
          fi
          if apphost_commit=$(git -C "$APPHOST_CHECKOUT" rev-parse --verify "$remote_ref^{commit}" 2>/dev/null); then
            :
          elif apphost_commit=$(git -C "$APPHOST_CHECKOUT" rev-parse --verify "$APPHOST_REF^{commit}" 2>/dev/null); then
            :
          else
            echo "AppHost ref '$APPHOST_REF' does not resolve in '$APPHOST_REPOSITORY'." >&2
            exit 1
          fi
          git -C "$APPHOST_CHECKOUT" checkout --detach "$apphost_commit"
          test -f "$APPHOST_CHECKOUT/$APPHOST"
          printf 'APPHOST_COMMIT=%s\n' "$apphost_commit" >> "$GITHUB_ENV"

      - name: Authenticate image registries
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/registry-login.sh"

      - name: Produce immutable preview request
        shell: bash
        run: |
          set -euo pipefail
          produce_args=(
            preview produce
            --descriptor "$GITHUB_WORKSPACE/$PRODUCER_DESCRIPTOR"
            --output "$PREVIEW_ARTIFACTS_DIR/module-preview.json"
            --working-directory "$GITHUB_WORKSPACE"
            --apphost "$APPHOST_CHECKOUT/$APPHOST"
            --artifacts-directory "$PREVIEW_ARTIFACTS_DIR/images"
            --aspire-executable "$ASPIRE_TOOL_DIR/aspire"
            --pin "$MODULE_NAME=https://github.com/$APPHOST_REPOSITORY.git@$APPHOST_COMMIT"
          )
          "$MODULAR_APPHOSTS_TOOL_DIR/dotnet-modular-apphosts" \
            "${produce_args[@]}"

      - name: Trigger and wait for consumer E2E
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          run_url=$(gh workflow run \
            'e2e.yml' \
            --repo 'example/consumer-tests' \
            --ref 'main' \
            --raw-field "manifest_json=$(<"$PREVIEW_ARTIFACTS_DIR/module-preview.json")")
          expected_run_prefix='https://github.com/example/consumer-tests/actions/runs/'
          run_id=${run_url##*/}
          if [[ ! "$run_id" =~ ^[0-9]+$ || "$run_url" != "$expected_run_prefix$run_id" ]]; then
            echo "gh workflow run returned an unexpected run URL: $run_url" >&2
            exit 1
          fi
          printf 'workflow_run_id=%s\nworkflow_run_url=%s\n' \
            "$run_id" "$run_url" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo 'example/consumer-tests' --exit-status

      - name: Link consumer run
        if: always() && steps.trigger.outputs.workflow_run_url != ''
        shell: bash
        run: |
          echo '### Consumer E2E' >> "$GITHUB_STEP_SUMMARY"
          echo '[Open workflow run](${{ steps.trigger.outputs.workflow_run_url }})' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-preview
          path: ${{ env.PREVIEW_ARTIFACTS_DIR }}
          if-no-files-found: warn
