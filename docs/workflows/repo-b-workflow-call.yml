name: Validate Repo B through reusable Repo A E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      image-tag:
        description: Tag used for Repo B images
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    runs-on: ubuntu-latest
    outputs:
      image-manifest: ${{ steps.images.outputs.manifest }}
    env:
      MODULE_IMAGE_TAG: ${{ inputs.image-tag || github.sha }}

    steps:
      - name: Check out Repo B
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Log in to the image registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Aspire
        run: dotnet tool install --global Aspire.Cli --version 13.4.6

      - name: Install the modular AppHost tool
        run: dotnet tool install --global Shirubasoft.Aspire.ModularAppHosts.Tool

      - name: Publish selected Repo B images
        id: images
        run: >-
          modular-apphosts manifest publish
          --apphost src/RepoB.AppHost
          --selector orders
          --tag "$MODULE_IMAGE_TAG"

  external-e2e:
    needs: publish-images
    uses: your-org/repo-a/.github/workflows/external-e2e.yml@main
    with:
      image-manifest: ${{ needs.publish-images.outputs.image-manifest }}
      repo-a-ref: main
    secrets: inherit
